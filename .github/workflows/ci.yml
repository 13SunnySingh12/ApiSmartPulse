# VALIDATION ONLY (§11.10). No deployment, no registry login, no image push, no release.
# Third-party actions are pinned to full commit SHAs (tag in the trailing comment).
name: CI

on:
  push:
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "30 20 * * *" # 02:00 IST nightly: E2E + security

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: No deployment / publish / registry push steps
        run: bash scripts/ci/no-deploy-guard.sh
      - name: CI never calls a live LLM
        run: bash scripts/ci/no-live-llm-guard.sh

  backend:
    needs: guard
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with: { distribution: temurin, java-version: "17", cache: maven }
      - name: Format (google-java-format)
        run: ./mvnw -B -ntp spotless:check
      - name: Compile, unit + Testcontainers integration tests
        run: ./mvnw -B -ntp verify
      - name: OpenAPI contract unchanged (or intentionally updated)
        run: git diff --exit-code openapi/openapi-v1.json
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with: { name: backend-test-reports, path: backend/target/surefire-reports, retention-days: 7 }

  ai-service:
    needs: guard
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: ai-service } }
    services:
      db:
        image: pgvector/pgvector:pg16
        env: { POSTGRES_PASSWORD: ci-ephemeral-only } # throwaway container, not a secret
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-retries 20
    env:
      LLM_PROVIDER: mock
      EMBEDDINGS_BACKEND: fake
      PGHOST: localhost
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: ci-ephemeral-only
      TEST_DB: apismartpulse_ci
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with: { python-version: "3.12", cache: pip, cache-dependency-path: ai-service/requirements-dev.txt }
      - name: Install (hash-locked; no ML extras, tests use the fake embedder)
        run: pip install --require-hashes -r requirements-dev.txt
      - name: Roles + Flyway migrations into a throwaway database
        run: bash ../scripts/ci/apply-migrations.sh
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy app
      - run: mkdir -p reports && pytest -q --junitxml=reports/pytest.xml
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with: { name: ai-test-reports, path: ai-service/reports, retention-days: 7 }

  frontend:
    needs: guard
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: "24", cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
      - run: npx prettier --check .
      - run: npm run lint
      - run: npm run lint:css
      - run: npm test -- --run
      - run: npm run build
        env: { VITE_API_BASE_URL: "http://localhost:8080" }
      - name: Bundle must not contain secrets
        run: bash ../scripts/ci/bundle-secret-check.sh dist

  security:
    needs: guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with: { distribution: temurin, java-version: "17", cache: maven }
      # Trivy resolves pom.xml from the local Maven repo; querying Maven Central directly gets 429s.
      - name: Resolve Maven dependencies for the scan
        run: cd backend && ./mvnw -B -ntp -q dependency:resolve
      - name: Trivy filesystem scan (vulnerabilities + secrets)
        run: |
          docker run --rm -v "$PWD:/src" -v "$HOME/.m2:/root/.m2:ro" aquasec/trivy:${TRIVY_VERSION} fs \
            --scanners vuln,secret --severity HIGH,CRITICAL --ignore-unfixed --offline-scan \
            --skip-dirs /src/frontend/node_modules --exit-code 1 /src
        env: { TRIVY_VERSION: "0.76.0" }
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with: { python-version: "3.12" }
      - name: pip-audit (runtime + ML extras)
        run: |
          pip install pip-audit==2.10.0
          pip-audit --disable-pip -r ai-service/requirements.txt
          pip-audit --disable-pip -r ai-service/requirements-ml.txt
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: "24" }
      - name: npm audit (production dependencies)
        run: cd frontend && npm ci && npm audit --omit=dev --audit-level=high

  docker-build:
    needs: [backend, ai-service, frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build images locally (NOT pushed anywhere)
        run: |
          docker build -t apismartpulse-backend:ci ./backend
          docker build -t apismartpulse-ai:ci --build-arg INSTALL_ML_EXTRAS=true ./ai-service
          docker build -t apismartpulse-frontend:ci --build-arg VITE_API_BASE_URL=http://localhost:8080 ./frontend

  e2e:
    needs: docker-build
    if: github.event_name == 'pull_request' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Create an ephemeral .env (generated + masked secrets, mock LLM, fake embeddings)
        run: bash scripts/make-env.sh --ci > .env
      - run: docker compose -f docker-compose.yml -f docker-compose.ci.yml up -d --build --wait
      - run: docker compose -f docker-compose.yml -f docker-compose.ci.yml --profile tools run --rm seed python -m scripts.seed --small
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: "24", cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: cd frontend && npm ci && npx playwright install --with-deps chromium
      - name: Playwright journeys + axe scans
        run: |
          set -a; . ./.env; set +a
          cd frontend && E2E_PASSWORD="$SEED_DEMO_PASSWORD" npx playwright test
        env: { E2E_BASE_URL: "http://localhost:8081", E2E_API_URL: "http://localhost:8080" }
      - name: Logs contain no secrets (QA-SEC-12)
        if: always()
        run: |
          docker compose -f docker-compose.yml -f docker-compose.ci.yml logs --no-color > compose-logs.txt
          set -a; . ./.env; set +a
          # Never upload logs that leaked a secret as a failure artifact.
          bash scripts/ci/log-secret-scan.sh compose-logs.txt || { rm -f compose-logs.txt; exit 1; }
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-artifacts
          path: |
            frontend/playwright-report
            compose-logs.txt
          retention-days: 7
      - if: always()
        run: docker compose -f docker-compose.yml -f docker-compose.ci.yml down -v
