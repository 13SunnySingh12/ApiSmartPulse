version: 2
updates:
  - package-ecosystem: maven
    directory: /backend
    schedule: { interval: weekly }
    groups: { maven-minor: { update-types: [minor, patch] } }
  - package-ecosystem: pip
    directory: /ai-service
    schedule: { interval: weekly }
    groups: { pip-minor: { update-types: [minor, patch] } }
  - package-ecosystem: npm
    directory: /frontend
    schedule: { interval: weekly }
    groups: { npm-minor: { update-types: [minor, patch] } }
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
  - package-ecosystem: docker
    directories: [/backend, /ai-service, /frontend]
    schedule: { interval: weekly }
